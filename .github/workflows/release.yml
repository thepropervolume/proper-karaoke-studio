name: Build Studio installers
run-name: Studio installers for ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all four platform builds to release.thepropervolume.com
        type: boolean
        default: false
      keep_artifacts:
        description: Keep a private copy in GitHub Actions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: studio-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref_type == 'tag' || !inputs.publish || github.ref_name == github.event.repository.default_branch
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-2025, npm: win, arch: x64 }
          - { platform: linux-x64, runner: ubuntu-24.04, npm: linux, arch: x64 }
          - { platform: macos-arm64, runner: macos-15, npm: mac, arch: arm64 }
          - { platform: macos-x64, runner: macos-15-intel, npm: mac, arch: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install Linux packaging prerequisites
        if: matrix.npm == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dpkg fakeroot
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Package native application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:${{ matrix.npm }} -- --${{ matrix.arch }} --publish never -c.directories.output=release/${{ matrix.platform }}
      - name: Name and validate installer assets
        run: node scripts/upload-studio-release.mjs prepare ${{ matrix.platform }}
      - name: Temporarily stage verified packages on the release server
        if: github.ref_type == 'tag' || inputs.publish
        env:
          STUDIO_RELEASE_SSH_KEY: ${{ secrets.STUDIO_RELEASE_SSH_KEY }}
          STUDIO_RELEASE_SSH_KNOWN_HOSTS: ${{ vars.STUDIO_RELEASE_SSH_KNOWN_HOSTS }}
        run: node scripts/upload-studio-release.mjs stage ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.keep_artifacts
        with:
          name: studio-${{ matrix.platform }}
          path: release/staged/${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: package
    if: github.ref_type == 'tag' || (inputs.publish && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Publish and switch latest after the complete build
        env:
          STUDIO_RELEASE_SSH_KEY: ${{ secrets.STUDIO_RELEASE_SSH_KEY }}
          STUDIO_RELEASE_SSH_KNOWN_HOSTS: ${{ vars.STUDIO_RELEASE_SSH_KNOWN_HOSTS }}
        run: node scripts/upload-studio-release.mjs publish
